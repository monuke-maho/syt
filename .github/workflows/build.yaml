name: Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: "Version"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            ytdlpUrl: 'https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe'
            ytdlpName: 'yt-dlp-x86_64-pc-windows-msvc.exe'
          - platform: 'ubuntu-latest'
            args: ''
            ytdlpUrl: 'https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp'
            ytdlpName: 'yt-dlp-x86_64-unknown-linux-gnu'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            ytdlpUrl: 'https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_macos'
            ytdlpName: 'yt-dlp-aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      
      - name: install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: install dependencies
        run: |
          bun install

      - name: download yt-dlp
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -fsSL ${{ matrix.ytdlpUrl }} -o ytdlp
          mv ytdlp src-tauri/binaries/${{ matrix.ytdlpName }}
      
      - name: permission
        if: ${{ matrix.platform == 'macos-latest' || matrix.platform == 'ubuntu-latest' }}
        run: |
          chmod +x src-tauri/binaries/${{ matrix.ytdlpName }}
          xattr -d com.apple.quarantine src-tauri/binaries/${{ matrix.ytdlpName }} || true

      - name: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: ${{ github.event.inputs.version || github.ref_name }}
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}